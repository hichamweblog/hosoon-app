name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Africa/Algiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Types and lint
        run: npm run type-check && npm run lint
      - name: Unit regressions and data provenance
        run: npm test && npm run verify-data
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser regressions (mock Supabase only)
        run: npm run test:e2e
      - name: Verify targeted offline manifest
        run: npm run verify-offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated local Supabase (never link a production project)
        run: npx --yes supabase@2.75.0 start
      - name: Apply migrations locally and test RLS
        run: npx --yes supabase@2.75.0 db reset --local && npx --yes supabase@2.75.0 test db
      - name: Stop local project
        if: always()
        run: npx --yes supabase@2.75.0 stop --no-backup
